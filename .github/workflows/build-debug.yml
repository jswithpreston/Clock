# Night Watch – build the debug APK
#
# Triggers:
#   • Every push to any branch (restrict to feature/night-watch if preferred)
#   • Manual dispatch (workflow_dispatch)
#
# Outputs:
#   • Artifact "night-watch-debug-apk" → Clock_*-debug.apk (14-day retention)
#
# Build requirements (from app/build.gradle):
#   JDK 17   (AGP 9.4.1 / Gradle 9.8.0 minimum)
#   compileSdk / targetSdk = 37
#   ndkVersion = 29.0.14206865
#
# Strategy: let Gradle auto-download missing SDK components via the SDK
# Manager built into AGP. The ubuntu-latest runner already ships with a
# recent Android SDK; we just need to ensure licenses are accepted and
# that the ANDROID_HOME env var is set correctly.

name: Build Debug APK (Night Watch)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up JDK 17 ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── 3. Accept SDK licenses ────────────────────────────────────────────────
      # The ubuntu-latest runner ships ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
      # All we need is to pre-accept licenses so AGP auto-download doesn't hang.
      - name: Accept Android SDK licenses
        run: |
          SDKMAN_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "${SDKMAN_DIR}/licenses"
          # Standard Android SDK license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "${SDKMAN_DIR}/licenses/android-sdk-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            >> "${SDKMAN_DIR}/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "${SDKMAN_DIR}/licenses/android-sdk-license"
          # Android SDK Preview license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "${SDKMAN_DIR}/licenses/android-sdk-preview-license"
          # Intel HAXM license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" \
            > "${SDKMAN_DIR}/licenses/intel-android-extra-license"
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" \
            >> "${SDKMAN_DIR}/licenses/intel-android-extra-license"

      # ── 4. Install SDK 37 and NDK via sdkmanager ──────────────────────────────
      # The runner image usually has SDK up to ~34; we need 37 and NDK 29.
      - name: Install SDK 37 and NDK 29
        run: |
          SDKMAN_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          # sdkmanager is in cmdline-tools
          SDKMANAGER=$(find "${SDKMAN_DIR}" -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${SDKMAN_DIR}"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      # ── 5. Build ──────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      # ── 6. Upload artifact ────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: night-watch-debug-apk
          path: app/build/outputs/apk/debug/Clock_*-debug.apk
          retention-days: 14
          if-no-files-found: error
